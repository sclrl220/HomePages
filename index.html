<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4f6f8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f141a" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="一个清爽、顺手、可自定义的网址导航。"
    />
    <title>渔网网址导航</title>
    <link rel="icon" type="image/svg+xml" href="fishnet-icon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Noto+Sans+SC:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <script src="app.js" defer></script>
  </head>
  <body>
    <main class="page-shell" id="top">
      <h1 class="visually-hidden">渔网网址导航</h1>
      <section class="hero" aria-label="搜索">
        <div class="hero-art" aria-hidden="true"></div>
        <a class="brand" href="#top" aria-label="渔网首页">
          <svg class="brand-mark" viewBox="0 0 48 48" fill="none" aria-hidden="true">
            <path
              d="M9 13h30M11 13l4 22 9 7 9-7 4-22M16 13l2 22m5-22v27m5-27-2 22m-5-17-8 6m10-6 10 6m-10 2-8 7m8-7 8 7"
              class="brand-net"
            />
            <path d="M9 13c2-4 5-6 9-6m21 6c-2-4-5-6-9-6" />
          </svg>
          <span>渔网<span class="brand-dot">.</span></span>
        </a>
        <div class="hero-content">
          <time class="clock" id="clock">08:37:51</time>
          <p class="date-line" id="date">10月13日 星期二</p>
          <form class="search-bar" id="search-form" role="search">
            <div class="engine-control">
              <button
                class="engine-trigger"
                id="engine-trigger"
                type="button"
                aria-label="选择搜索引擎"
                aria-haspopup="listbox"
                aria-expanded="false"
                aria-controls="engine-options"
              >
                <span class="engine-symbol" id="engine-symbol" aria-hidden="true"></span>
                <span class="engine-current" id="engine-current">百度</span>
                <svg class="chevron" viewBox="0 0 16 16" fill="none" aria-hidden="true">
                  <path d="m4 6 4 4 4-4" />
                </svg>
              </button>
              <select id="search-engine" aria-label="选择搜索引擎" hidden>
                <option value="baidu">百度</option>
                <option value="google">谷歌</option>
              </select>
              <div class="engine-options" id="engine-options" role="listbox" aria-label="搜索引擎" hidden>
                <button class="engine-option" type="button" role="option" data-engine="baidu" aria-selected="true">
                  <span class="engine-symbol engine-symbol-baidu" aria-hidden="true"></span>
                  <span>百度</span>
                </button>
                <button class="engine-option" type="button" role="option" data-engine="google" aria-selected="false">
                  <span class="engine-symbol engine-symbol-google" aria-hidden="true"></span>
                  <span>谷歌</span>
                </button>
              </div>
            </div>
            <span class="search-divider" aria-hidden="true"></span>
            <input
              id="search-input"
              type="search"
              placeholder="搜索网页，或按 / 聚焦"
              autocomplete="off"
              aria-label="搜索关键词"
            />
            <button class="search-submit" type="submit" aria-label="开始搜索">
              <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <circle cx="10.8" cy="10.8" r="6.8" />
                <path d="m16 16 4.5 4.5" />
              </svg>
            </button>
          </form>
        </div>
      </section>

      <section class="favorites-section" aria-labelledby="favorites-title">
        <div class="section-heading">
          <h2 id="favorites-title">快捷方式</h2>
          <p class="section-note">每天会点的入口，拖拽可排序</p>
        </div>
        <div class="favorites-rail" id="favorites-rail" aria-label="快捷方式"></div>
      </section>

      <section class="directory" aria-labelledby="directory-title">
        <div class="directory-toolbar">
          <h2 id="directory-title">分类收藏 <span id="site-count">12</span></h2>
          <button class="add-link" id="add-category" type="button">
            <span aria-hidden="true">＋</span> 添加分类
          </button>
        </div>
        <div id="category-list"></div>
      </section>

      <footer class="footer">
        <span class="footer-brand">渔网<span class="brand-dot">.</span></span>
        <span>日常所需，恰好在此。</span>
        <a href="#top" id="back-to-top">回到顶部 ↑</a>
      </footer>
    </main>

    <dialog class="add-dialog" id="add-dialog" aria-labelledby="dialog-title">
      <form id="add-form">
        <div class="dialog-heading">
          <h2 id="dialog-title">添加网址</h2>
          <button class="dialog-close" type="button" id="close-dialog" aria-label="关闭">
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8" /></svg>
          </button>
        </div>
        <label class="form-field">
          <span>网站名称</span>
          <input name="name" required maxlength="24" placeholder="例如：我的工作台" aria-describedby="form-error" />
        </label>
        <label class="form-field">
          <span>网址链接</span>
          <input name="url" type="url" required placeholder="https://example.com" aria-describedby="form-error" />
        </label>
        <label class="form-field">
          <span>放入分类</span>
          <select name="category" id="category-select" required aria-describedby="form-error"></select>
        </label>
        <p class="form-error" id="form-error" role="alert" hidden>请输入有效的网址链接。</p>
        <button class="submit-link" type="submit">保存到导航 <span aria-hidden="true">↗</span></button>
      </form>
    </dialog>

    <dialog class="add-dialog" id="category-dialog" aria-labelledby="category-dialog-title">
      <form id="category-form">
        <div class="dialog-heading">
          <h2 id="category-dialog-title">添加分类</h2>
          <button class="dialog-close" type="button" id="close-category-dialog" aria-label="关闭">
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8" /></svg>
          </button>
        </div>
        <label class="form-field">
          <span>分类名称</span>
          <input name="name" required maxlength="16" placeholder="例如：设计灵感" aria-describedby="category-form-error" />
        </label>
        <p class="form-error" id="category-form-error" role="alert" hidden>请填写分类名称。</p>
        <button class="submit-link" type="submit">创建分类 <span aria-hidden="true">↗</span></button>
      </form>
    </dialog>

    <dialog class="add-dialog" id="favorite-dialog" aria-labelledby="favorite-dialog-title">
      <form id="favorite-form">
        <div class="dialog-heading">
          <h2 id="favorite-dialog-title">修改快捷方式</h2>
          <button class="dialog-close" type="button" id="close-favorite-dialog" aria-label="关闭">
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8" /></svg>
          </button>
        </div>
        <label class="form-field">
          <span>显示名称</span>
          <input name="name" required maxlength="24" aria-describedby="favorite-form-error" />
        </label>
        <label class="form-field">
          <span>网站网址</span>
          <input name="url" type="url" required aria-describedby="favorite-form-error" />
        </label>
        <p class="form-error" id="favorite-form-error" role="alert" hidden>请输入有效的网址链接。</p>
        <button class="submit-link" type="submit">保存快捷方式 <span aria-hidden="true">↗</span></button>
      </form>
    </dialog>

    <dialog class="add-dialog" id="move-favorite-dialog" aria-labelledby="move-favorite-title">
      <form id="move-favorite-form">
        <div class="dialog-heading">
          <h2 id="move-favorite-title">移到分类收藏</h2>
          <button class="dialog-close" type="button" id="close-move-favorite" aria-label="关闭">
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8" /></svg>
          </button>
        </div>
        <label class="form-field">
          <span>选择目标分类</span>
          <select name="category" id="move-favorite-category" required aria-describedby="move-favorite-error"></select>
        </label>
        <p class="form-error" id="move-favorite-error" role="alert" hidden>移动失败，请重试。</p>
        <button class="submit-link" type="submit">移动网址 <span aria-hidden="true">↗</span></button>
      </form>
    </dialog>
  </body>
</html>
